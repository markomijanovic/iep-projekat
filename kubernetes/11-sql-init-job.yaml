apiVersion: batch/v1
kind: Job
metadata:
  name: sql-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: sql-init
    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4
          command:
            - sh
            - -c
            - >
              until mysqladmin ping
              -h mysql
              -uroot
              -p"$MYSQL_ROOT_PASSWORD";
              do
                echo "Waiting for MySQL...";
                sleep 2;
              done
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iep-secrets
                  key: MYSQL_ROOT_PASSWORD

      containers:
        - name: sql-init
          image: iep-project:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - services.auth.init_db
          envFrom:
            - configMapRef:
                name: iep-config
            - secretRef:
                name: iep-secrets