apiVersion: apps/v1
kind: Deployment
metadata:
  name: ganache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ganache
  template:
    metadata:
      labels:
        app: ganache
    spec:
      containers:
        - name: ganache
          image: trufflesuite/ganache-cli:latest
          args:
            - --accounts
            - "10"
            - --defaultBalanceEther
            - "1000"
            - --deterministic
            - --networkId
            - "5777"
            - --chainId
            - "1337"
            - --host
            - "0.0.0.0"
          ports:
            - containerPort: 8545

          readinessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ganache
spec:
  type: NodePort
  selector:
    app: ganache
  ports:
    - port: 8545
      targetPort: 8545
      nodePort: 30545